
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourseHub | Add Course</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6ff;
            color: #29234e;
        }

        header {
            background: white;
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 3px 15px #00000010;
        }

        .logo {
            color: #6547d7;
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            text-decoration: none;
            color: #44445c;
            margin-left: 18px;
            font-weight: bold;
            font-size: 14px;
        }

        nav a:hover {
            color: #6547d7;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 5px 25px #25204b12;
        }

        h1 {
            text-align: center;
            color: #6547d7;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #77778b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #d8d5e8;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #6547d7;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #6547d7;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4930b3;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            background: #25234a;
            color: white;
            padding: 22px;
            margin-top: 60px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">CourseHub.</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="list.html">Courses</a>
        <a href="listOne.html">Find Course</a>
        <a href="insert.html">Add Course</a>
        <a href="update.html">Update</a>
        <a href="delete.html">Delete</a>
    </nav>
</header>

<div class="container">

    <h1>➕ Add New Course</h1>
    <p class="subtitle">Enter the course details below</p>

    <form id="courseForm">

        <label>Course Code</label>
        <input type="text" id="course_code"
               placeholder="Example: CSE301" required>

        <label>Course Name</label>
        <input type="text" id="course_name"
               placeholder="Enter course name" required>

        <label>Credits</label>
        <input type="number" id="credits"
               placeholder="Enter credits" min="1" required>

        <label>Department</label>
        <input type="text" id="department"
               placeholder="Example: Computer Science" required>

        <label>Semester</label>
        <input type="number" id="semester"
               placeholder="Enter semester (1-8)"
               min="1" max="8" required>

        <button type="submit">Add Course</button>

    </form>

    <p id="message"></p>

</div>

<footer>
    <p>© 2026 CourseHub. All Rights Reserved.</p>
</footer>

<script>
    document.getElementById("courseForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const course = {
            course_code: document.getElementById("course_code").value,
            course_name: document.getElementById("course_name").value,
            credits: document.getElementById("credits").value,
            department: document.getElementById("department").value,
            semester: document.getElementById("semester").value
        };

        try {
            const response = await fetch("http://localhost:3000/courses", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(course)
            });

            const result = await response.json();

            if (response.ok) {
                document.getElementById("message").style.color = "green";
                document.getElementById("message").innerText =
                    result.message + " Course ID: " + result.course_id;

                document.getElementById("courseForm").reset();
            } else {
                throw new Error(result.error || result.message);
            }

        } catch (error) {
            document.getElementById("message").style.color = "red";
            document.getElementById("message").innerText =
                "Error: " + error.message;
        }

    });
</script>

</body>
</html>
