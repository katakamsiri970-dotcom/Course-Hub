
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourseHub | All Courses</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6ff;
            color: #29234e;
        }

        header {
            background: white;
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 3px 15px #00000010;
        }

        .logo {
            color: #6547d7;
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            text-decoration: none;
            color: #44445c;
            margin-left: 18px;
            font-weight: bold;
            font-size: 14px;
        }

        nav a:hover {
            color: #6547d7;
        }

        .container {
            width: 90%;
            margin: 50px auto;
        }

        h1 {
            text-align: center;
            color: #6547d7;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: #77778b;
            margin-bottom: 30px;
        }

        .table-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 25px #25204b12;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th {
            background: #6547d7;
            color: white;
            padding: 16px;
        }

        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #eeeaf8;
        }

        tr:hover td {
            background: #f7f4ff;
        }

        .refresh {
            display: block;
            margin: 25px auto;
            padding: 13px 25px;
            background: #6547d7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .refresh:hover {
            background: #4930b3;
        }

        #message {
            text-align: center;
            color: #77778b;
            margin-top: 20px;
        }

        footer {
            text-align: center;
            background: #25234a;
            color: white;
            padding: 22px;
            margin-top: 70px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">CourseHub.</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="list.html">Courses</a>
        <a href="listOne.html">Find Course</a>
        <a href="insert.html">Add Course</a>
        <a href="update.html">Update</a>
        <a href="delete.html">Delete</a>
    </nav>
</header>

<div class="container">

    <h1>📚 All Courses</h1>
    <p class="subtitle">Explore all available courses</p>

    <div class="table-container">

        <table>
            <thead>
                <tr>
                    <th>Course ID</th>
                    <th>Course Code</th>
                    <th>Course Name</th>
                    <th>Credits</th>
                    <th>Department</th>
                    <th>Semester</th>
                </tr>
            </thead>

            <tbody id="courseTable">
                <tr>
                    <td colspan="6">Loading courses...</td>
                </tr>
            </tbody>
        </table>

    </div>

    <button class="refresh" onclick="loadCourses()">
        Refresh Courses
    </button>

    <p id="message"></p>

</div>

<footer>
    <p>© 2026 CourseHub. All Rights Reserved.</p>
</footer>

<script>
    async function loadCourses() {

        const table = document.getElementById("courseTable");
        const message = document.getElementById("message");

        table.innerHTML = "<tr><td colspan='6'>Loading courses...</td></tr>";
        message.innerText = "";

        try {
            const response = await fetch("/courses");

            if (!response.ok) {
                throw new Error("Unable to fetch courses");
            }

            const courses = await response.json();

            table.innerHTML = "";

            if (courses.length === 0) {
                table.innerHTML =
                    "<tr><td colspan='6'>No courses available. Please add a course.</td></tr>";
                return;
            }

            courses.forEach(course => {

                const row = document.createElement("tr");

                [
                    course.course_id,
                    course.course_code,
                    course.course_name,
                    course.credits,
                    course.department,
                    course.semester
                ].forEach(value => {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                table.appendChild(row);
            });

        } catch (error) {
            table.innerHTML =
                "<tr><td colspan='6'>Error loading courses</td></tr>";

            message.innerText = error.message;
        }
    }

    loadCourses();
</script>

</body>
</html>
